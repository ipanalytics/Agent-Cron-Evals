[project]
name = "agent-cron-evals"
version = "1.0.0"
description = "Deterministic checks for scheduled agent jobs: did it run, did it succeed, did the output arrive, is the watchdog still alive"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["cron", "evals", "monitoring", "agents", "reliability", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agent-cron-evals = "agent_cron_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_cron_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
